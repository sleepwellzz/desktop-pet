<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- 与宠物层/气泡层一致：本应用没有任何远程内容 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>desktop-pet-control-bar</title>
  <style>
    /* 高度必须与主进程的算式严格对齐（**四段**）：
       headerHeight + 会话行数 × rowHeight + 动作排行数 × actionRowHeight + footerHeight
       （desktop-pet.json → controlBar）。每段都用 border-box + 显式高度 ——
       否则一条分隔线就会让面板比窗口矮 1px，出现滚动条或底部被切。
       动作排的两个参数**不写死在这里**：它们随 BarView 下发，由 control-bar.ts 设到
       #plays 的 grid-template-columns / grid-auto-rows / height 上（见那处注释）。 */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1b1f27; overflow: hidden;
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      color: #e8ecf2; font-size: 12px; user-select: none;
    }
    #bar { display: flex; flex-direction: column; width: 100%; height: 100%; }

    #head {
      flex: 0 0 30px; height: 30px; box-sizing: border-box;
      display: flex; align-items: center; gap: 6px;
      padding: 0 6px 0 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #summary { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 会话行：每行 28px，与 rowHeight 对应 */
    #sessions { flex: 0 0 auto; }
    .row {
      height: 28px; box-sizing: border-box;
      display: flex; align-items: center; gap: 6px;
      padding: 0 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .row .sid { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .st { flex: 0 0 auto; color: #aab4c2; }
    .row .t { flex: 0 0 auto; color: #7d8794; font-size: 11px; }
    /* 很久没动静的会话（多半是上次运行留下的残留）：时间标成暖色，鼠标悬停能看到解释 */
    .row .t.stale { color: #c98a4b; }
    .row.more { color: #7d8794; }
    .row .ack {
      flex: 0 0 auto; margin-left: 2px;
      padding: 1px 7px; border: 1px solid rgba(226, 134, 60, 0.55);
      border-radius: 4px; background: transparent; color: #e2863c;
      font: inherit; font-size: 11px; cursor: pointer;
    }
    .row .ack:hover { background: rgba(226, 134, 60, 0.16); }

    #actions {
      flex: 0 0 42px; height: 42px; box-sizing: border-box;
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    #actions .sp { flex: 1 1 auto; }
    #actions button {
      padding: 3px 8px; border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px; background: rgba(255, 255, 255, 0.06);
      color: #e8ecf2; font: inherit; font-size: 11px; cursor: pointer;
    }
    #actions button:hover { background: rgba(255, 255, 255, 0.14); }
    #actions button:disabled { opacity: 0.4; cursor: default; }
    /* 「全部已确认」：唯一被强调的动作排按钮 —— 它是"把错误状态消掉"的出口，
       用户报告的核心诉求就是能一键消干净（2026-09-18）。暖色描边与行内「确认」同一套语义色。 */
    #actions #clear-all {
      border-color: rgba(226, 134, 60, 0.55);
      color: #e2863c;
    }
    #actions #clear-all:hover { background: rgba(226, 134, 60, 0.16); }
    #actions #clear-all[hidden] { display: none; }
    /* 宠物名：面板的身份标识。不抢注意力（比状态行弱），但比"只读的百分比"有意义 */
    #actions #pet-name {
      min-width: 34px; max-width: 120px; text-align: center;
      color: #aab4c2; font-size: 11px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* 状态点：与托盘/气泡同一套语义色。非主状态的会话整体压暗，一眼看出谁在决定宠物的样子 */
    .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: #6b7684; }
    .dot.s-needs-input { background: #e2863c; }
    .dot.s-blocked { background: #e0584f; }
    .dot.s-running { background: #4c9be8; }
    .dot.s-ready { background: #4cb782; }
    .dot.dim { opacity: 0.45; }

    .row.ackable:hover { background: rgba(255, 255, 255, 0.05); }

    /* —— 手动把玩动作排（2026-09-22，ADR 038）——
       让用户像逗宠物一样随时触发任意一个动作，与 agent 现在是什么状态无关。
       列数 / 行高 / 总高**全部由渲染层按 BarView 里的 actionColumns / actionRowHeight 设**
       （见 control-bar.ts 的 renderActions），这里不写死任何一个 ——
       主进程按同一对值算窗口高度，两边各写一份就会出现"面板比窗口矮一截、底部被切"。
       **刻意不加 border/padding 的纵向值**：容器的内容高必须严格等于 行数 × actionRowHeight，
       多 1px 就会顶掉面板底部（会话行的分隔线在自己身上，那是对的）。 */
    #plays {
      flex: 0 0 auto; box-sizing: border-box;
      display: grid; gap: 0 4px; padding: 0 8px;
    }
    #plays button {
      align-self: stretch; margin: 3px 0; padding: 0 2px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px; background: rgba(255, 255, 255, 0.06);
      color: #cdd5e0; font: inherit; font-size: 11px;
      cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #plays button:hover { background: rgba(255, 255, 255, 0.14); color: #e8ecf2; }
    /* 正在演的那一个：暖色描边（与行内「确认」同一套语义色 —— 都是"你刚让它做的事"）。
       再点一次就是停止，所以它同时是一个可点的"取消"。 */
    #plays button.on {
      border-color: rgba(226, 134, 60, 0.75);
      background: rgba(226, 134, 60, 0.18);
      color: #e2863c;
    }

    #close {
      flex: 0 0 auto; width: 20px; height: 20px; padding: 0; line-height: 18px;
      border: none; border-radius: 4px; background: transparent;
      color: #7d8794; font: inherit; font-size: 14px; cursor: pointer;
    }
    #close:hover { background: rgba(255, 255, 255, 0.12); color: #e8ecf2; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="head">
      <span id="dot" class="dot"></span>
      <span id="summary"></span>
      <!-- data-cmd 不能少：渲染层的点击是**事件委托**在 [data-cmd] 上做的，
           少了它这个按钮就完全没反应（2026-09-16 用户实测："关闭键只能按 ESC，鼠标点无效"）。 -->
      <button id="close" data-cmd="close-bar" title="收起（Esc）">×</button>
    </div>
    <div id="sessions"></div>
    <!-- 动作排（手动把玩）：按宠物包里的动作清单渲染成小按钮，点了宠物就演一次。
         与 agent 状态无关，且**不产生气泡** —— 手动 = 陪它玩，agent = 有事告诉你。
         内容与排版参数都由主进程下发（见 control-bar.ts 的 render）。 -->
    <div id="plays"></div>
    <div id="actions">
      <button data-cmd="hide-pet">隐藏宠物</button>
      <span class="sp"></span>
      <!-- 面板的身份：显示宠物包里的名字（不是硬编码的"淘淘"），换包自动跟着变。
           这里曾经是一个只读的缩放百分比（70%），按用户 2026-09-17 的意见换成名字；
           大小操作统一走「⋯ 更多」/ 托盘 / 右键菜单里的档位。 -->
      <span id="pet-name"></span>
      <span class="sp"></span>
      <!-- 「全部已确认」：把"在等你看"的会话一次标为已读，宠物立刻回待机。
           有多条待确认时才出现（只有一条时行内那个「确认」已经够了），
           所以默认 hidden —— 由渲染层按 ackableCount 切换（2026-09-18 用户要求）。
           必须放在 ⋯ 左边：它是"消掉错误状态"的出口，比"打开更多菜单"更该被先看到。 -->
      <button id="clear-all" data-cmd="ack-all" hidden>已确认</button>
      <button data-cmd="popup-menu" title="全部菜单动作（宠物大小 / 开机自启 / 清空状态会话 / 退出）">⋯</button>
    </div>
  </div>
  <script src="control-bar.js"></script>
</body>
</html>
